<script>
(function () {
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  function renderAttention(list) {
    var host = document.getElementById('attention');
    if (!list || !list.length) {
      AppStates.empty('#attention', 'All clear', 'No parties need attention right now.');
      return;
    }
    host.innerHTML = list.map(function (p) {
      var dot = p.overdue ? 'bg-[#ba1a1a]' : 'bg-primary-container';
      return '<div class="flex items-center justify-between py-stack-md hairline-b">' +
        '<div class="flex flex-col gap-base"><span class="font-body-md text-on-surface font-medium flex items-center gap-2">' +
        esc(p.name) + '<span class="w-1.5 h-1.5 rounded-full ' + dot + '"></span></span>' +
        (p.gap ? '<span class="font-label-sm text-secondary">' + esc(p.gap) + '</span>' : '') +
        '</div><span class="font-data-md text-data-md text-on-surface">' + inr(p.amount) + '</span></div>';
    }).join('');
  }

  function load() {
    AppStates.loading('#attention', 'Loading…');
    google.script.run
      .withSuccessHandler(function (d) {
        document.getElementById('recv').textContent = inr(d.receivable);
        document.getElementById('pay').textContent = inr(d.payable);
        document.getElementById('overdue').textContent = inr(d.overdue);
        document.getElementById('unrecon').textContent = d.unreconciled + ' entries';
        renderAttention(d.attention);
      })
      .withFailureHandler(function (e) {
        AppStates.error('#attention', 'Could not load dashboard', load);
      })
      .getHomeData();
  }

  document.addEventListener('DOMContentLoaded', load);
  if (document.readyState !== 'loading') load();
})();
</script>
