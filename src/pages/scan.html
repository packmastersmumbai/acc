<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
<style>
  body { font-family:'Hanken Grotesk',sans-serif; background:#fafaf9; color:#18181b; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .hairline-b { border-bottom:1px solid #e7e5e4; }
  .btn-primary { background:#047857; color:#fff; border-radius:4px; }
  .btn-ghost { color:#71717a; border-radius:4px; }
  .tag-matched { color:#047857; background:rgba(4,120,87,0.1); border-radius:4px; }
  .tag-nomatch { color:#ba1a1a; background:rgba(186,26,26,0.08); border-radius:4px; }
</style>

<body class="min-h-screen">
<header class="flex items-center justify-between px-4 h-16 hairline-b bg-[#fafaf9] sticky top-0 z-10">
  <button class="p-2 -ml-2" onclick="history.back()"><span class="material-symbols-outlined">chevron_left</span></button>
  <h1 class="mono text-sm uppercase tracking-wider">Scan bill</h1>
  <div class="w-10"></div>
</header>

<main class="px-4 py-4 pb-40 max-w-3xl mx-auto">
  <!-- Capture -->
  <section id="captureSection">
    <label for="fileInput" class="w-full flex items-center p-4 border border-dashed border-[#047857]/40 rounded-lg cursor-pointer hover:bg-[#047857]/5">
      <span class="material-symbols-outlined text-[#047857] mr-3">document_scanner</span>
      <div>
        <div class="text-base text-[#047857] font-semibold">Take photo or upload bill</div>
        <div class="text-[13px] text-[#71717a]">Photo or PDF · GST · Udyam · remittance advice</div>
      </div>
    </label>
    <input id="fileInput" type="file" accept="image/*,application/pdf" class="hidden"/>
  </section>

  <!-- Status host (loading/error) -->
  <div id="statusHost" class="mt-4"></div>

  <!-- Read-from-document -->
  <section id="readSection" class="hidden mt-6">
    <h2 class="mono text-xs text-[#71717a] uppercase tracking-widest mb-2">Read from document</h2>
    <!-- Raised when a field could not be read, or when taxable + tax does not
         equal the total. OCR is best-effort; the user is the check. -->
    <div id="checkWarn" class="hidden mb-3 p-3 rounded border border-[#ba1a1a]/30 bg-[#ba1a1a]/5">
      <div class="mono text-xs uppercase tracking-widest text-[#ba1a1a] mb-1">Check before posting</div>
      <div id="checkWarnText" class="text-[13px] text-[#71717a]"></div>
    </div>
    <div class="border-t border-[#e7e5e4]">
      <div class="flex justify-between py-3 hairline-b"><span class="mono text-xs text-[#71717a] uppercase">Supplier</span><span id="rSupplier" class="mono text-sm"></span></div>
      <div class="flex justify-between py-3 hairline-b"><span class="mono text-xs text-[#71717a] uppercase">GSTIN</span><span id="rGstin" class="mono text-sm"></span></div>
      <div class="flex justify-between py-3 hairline-b"><span class="mono text-xs text-[#71717a] uppercase">Invoice</span><span id="rInvoice" class="mono text-sm"></span></div>
      <!-- Amount is EDITABLE: OCR is the likeliest field to be wrong, and a
           wrong total posts real money. The user confirms it, never the app. -->
      <div class="flex justify-between items-center py-3 hairline-b">
        <span class="mono text-xs text-[#71717a] uppercase">Amount</span>
        <span class="flex items-center gap-1">
          <span class="mono text-base text-[#71717a]">₹</span>
          <input id="rAmount" type="text" inputmode="decimal"
                 class="mono text-base bg-transparent text-right border-b border-[#e7e5e4] w-40 py-1 focus:border-[#047857] outline-none"/>
        </span>
      </div>
      <div class="flex justify-between py-3 hairline-b"><span class="mono text-xs text-[#71717a] uppercase">Date</span><span id="rDate" class="mono text-sm"></span></div>
      <div class="flex justify-between py-3 hairline-b"><span class="mono text-xs text-[#71717a] uppercase">GST</span><span id="rGst" class="mono text-sm"></span></div>
      <div class="flex justify-between items-center py-3 hairline-b">
        <span class="mono text-xs text-[#71717a] uppercase">Expense account</span>
        <select id="rAccount" class="mono text-sm bg-transparent text-right border-b border-[#e7e5e4] py-1"></select>
      </div>
      <div id="rDocRow" class="hidden flex justify-between items-center py-3 hairline-b">
        <span class="mono text-xs text-[#71717a] uppercase">Document</span>
        <a id="rDocLink" target="_blank" rel="noopener"
           class="mono text-sm text-[#047857] underline flex items-center gap-1">
          <span class="material-symbols-outlined text-base">description</span>Open in Drive</a>
      </div>
    </div>
  </section>

  <!-- Matched party -->
  <section id="matchedSection" class="hidden mt-6">
    <h2 class="mono text-xs text-[#71717a] uppercase tracking-widest mb-2">Matched party</h2>
    <div class="border-t border-[#e7e5e4]">
      <div class="py-4 pl-3 pr-1 hairline-b relative">
        <div class="absolute left-0 top-0 bottom-0 w-[2px] bg-[#047857]"></div>
        <div class="flex justify-between items-start mb-1">
          <span id="mName" class="mono text-sm"></span>
          <span class="mono text-xs uppercase tag-matched px-2 py-0.5">Matched</span>
        </div>
        <div id="mMeta" class="mono text-xs text-[#71717a]"></div>
      </div>
    </div>
  </section>

  <!-- No match -->
  <section id="noMatchSection" class="hidden mt-6">
    <div class="p-3 tag-nomatch mono text-xs uppercase tracking-widest">No matching party found</div>
    <h2 class="mono text-xs text-[#71717a] uppercase tracking-widest mt-4 mb-2">Create new</h2>
    <div class="border-t border-[#e7e5e4]">
      <button id="createVendorBtn" class="w-full flex items-center justify-between py-4 px-1 hairline-b hover:bg-[#f5f5f4]">
        <span class="text-sm">Create supplier from this bill</span>
        <span class="material-symbols-outlined text-[#047857]">arrow_forward</span>
      </button>
    </div>
  </section>
</main>

<!-- Bottom action -->
<div id="actionBar" class="hidden fixed bottom-0 w-full px-4 py-4 bg-[#fafaf9]/95 border-t border-[#e7e5e4]">
  <button id="postBtn" class="w-full btn-primary py-3 mono text-sm uppercase tracking-wide">Post bill to Zoho</button>
</div>

<script>
(function () {
  var parsed = null, matched = null, archivedUrl = null;

  function show(id, on) { document.getElementById(id).classList.toggle('hidden', !on); }

  // Expense accounts come from the server (default first) so the posting
  // account is visible and changeable BEFORE the bill is written to Zoho.
  function loadAccounts() {
    google.script.run
      .withSuccessHandler(function (accts) {
        var sel = document.getElementById('rAccount');
        sel.innerHTML = (accts || []).map(function (a) {
          return '<option value="' + a.id + '">' + a.name + '</option>';
        }).join('');
      })
      .withFailureHandler(function () { /* postBill falls back to the default */ })
      .getExpenseAccounts();
  }
  loadAccounts();

  function renderParsed(p) {
    document.getElementById('rSupplier').textContent = p.supplier || '—';
    document.getElementById('rGstin').textContent = p.gstin || '—';
    document.getElementById('rInvoice').textContent = p.invoiceNo || '—';
    document.getElementById('rDate').textContent = p.date || 'today (not read)';
    document.getElementById('rGst').textContent = p.gstPct != null ? p.gstPct + '%' : '—';
    // Plain digits, so the user can correct it without fighting formatting.
    document.getElementById('rAmount').value = p.amount != null ? p.amount.toFixed(2) : '';
    renderWarnings(p);
    show('readSection', true);
  }

  // Every field OCR could not establish, plus the arithmetic check. Posting is
  // never blocked — the user may know better than the parser — but nothing
  // uncertain is allowed to look confirmed.
  function renderWarnings(p) {
    var w = [];
    if (p.amount == null) w.push('the amount could not be read — type it in');
    if (p.checksOut === false) w.push('taxable + tax does not equal the total');
    if (!p.date) w.push('no invoice date found — today will be used');
    if (p.gstPct == null) w.push('GST rate not found');
    if (!p.invoiceNo) w.push('no invoice number found');

    var host = document.getElementById('checkWarn');
    if (!w.length) { host.classList.add('hidden'); return; }
    document.getElementById('checkWarnText').textContent =
      w.join('; ') + '. Verify against the bill before posting.';
    host.classList.remove('hidden');
  }

  /** The amount the USER confirmed, not the one OCR guessed. */
  function enteredAmount() {
    var v = String(document.getElementById('rAmount').value || '').replace(/[^\d.\-]/g, '');
    if (!v) return null;
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function renderMatch(m) {
    if (m) {
      document.getElementById('mName').textContent = m.contact_name;
      document.getElementById('mMeta').textContent =
        (m.contact_type || 'party') + ' · ' + (m.gst_no || '') + ' · ' + inr(m.outstanding || 0) + ' open';
      show('matchedSection', true); show('noMatchSection', false);
    } else {
      show('noMatchSection', true); show('matchedSection', false);
    }
    show('actionBar', true);
  }

  function runMatch(gstin) {
    if (!gstin) { renderMatch(null); return; }
    google.script.run
      .withSuccessHandler(function (m) { matched = m; renderMatch(m); })
      .withFailureHandler(function () { renderMatch(null); })
      .matchContactByGstin(gstin);
  }

  function onFile(file) {
    var isPdf = window.isPdf(file);
    AppStates.loading('#statusHost', isPdf ? 'Reading PDF…' : 'Reading bill…');
    window.fileToBase64(file).then(function (img) {
      google.script.run
        .withSuccessHandler(function (text) {
          google.script.run
            .withSuccessHandler(function (p) {
              parsed = p; AppStates.clear('#statusHost'); renderParsed(p); runMatch(p.gstin);
              // Keep the original document — OCR discards its temp copy. Best-effort:
              // a Drive failure must not disturb a scan that already succeeded.
              google.script.run
                .withSuccessHandler(function (r) {
                  if (!r || !r.url) return;
                  archivedUrl = r.url;
                  document.getElementById('rDocLink').href = archivedUrl;
                  show('rDocRow', true);
                })
                .withFailureHandler(function () { /* archiving is bookkeeping */ })
                .archiveScan(img.base64, img.mime, p.supplier || '');
            })
            .withFailureHandler(function () { AppStates.error('#statusHost', 'Could not parse the bill', null); })
            .parseBill(text);
        })
        .withFailureHandler(function () {
          AppStates.error('#statusHost',
            isPdf ? 'OCR failed — this PDF may be image-only or unreadable'
                  : 'OCR failed — try a clearer photo', null);
        })
        .ocrExtract(img.base64, img.mime);
    }).catch(function (e) {
      AppStates.error('#statusHost',
        (e && e.message === 'PDF_TOO_LARGE')
          ? 'PDF is too large (over 2MB) — split it or upload a photo instead'
          : (isPdf ? 'Could not read the PDF' : 'Could not read the image'), null);
    });
  }

  document.getElementById('fileInput').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) onFile(e.target.files[0]);
  });

  document.getElementById('postBtn').addEventListener('click', function () {
    if (!parsed) return;
    if (!matched) {
      AppStates.error('#statusHost', 'Create or match a supplier before posting', null);
      return;
    }
    var sel = document.getElementById('rAccount');
    var acctId = sel.value;
    var acctName = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';

    // The amount the user confirmed on screen wins over the parsed one.
    var amount = enteredAmount();
    if (amount === null || amount <= 0) {
      AppStates.error('#statusHost', 'Enter the bill amount before posting', null);
      document.getElementById('rAmount').focus();
      return;
    }

    // This WRITES to Zoho — confirm explicitly, naming the amount and the
    // account charged, since a miscoded bill is invisible until reconciliation.
    var warn = document.getElementById('checkWarn').classList.contains('hidden')
      ? '' : '\n\n⚠ Some fields could not be verified — check the bill.';
    if (!window.confirm('Post this bill to Zoho?\n\nSupplier: ' + matched.contact_name +
                        '\nAmount: ₹' + amount.toFixed(2) +
                        '\nAccount: ' + acctName + warn)) return;

    var btn = this;
    btn.disabled = true;
    AppStates.loading('#statusHost', 'Posting bill…');
    google.script.run
      .withSuccessHandler(function (r) {
        AppStates.empty('#statusHost', 'Bill posted',
          'Zoho bill ' + (r && r.bill_id ? r.bill_id : '') + ' created.');
        show('actionBar', false);
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        AppStates.error('#statusHost',
          'Could not post the bill' + (e && e.message ? ' — ' + e.message : ''), null);
      })
      .postBill({
        vendorId: matched.contact_id,
        billNumber: parsed.invoiceNo,
        date: parsed.date || new Date().toISOString().slice(0, 10),
        amount: amount,                 // user-confirmed, not the OCR guess
        gstPct: parsed.gstPct,
        inter: !!parsed.inter,
        description: parsed.description || 'Goods',
        expenseAccountId: acctId,
        scanUrl: archivedUrl          // links the Zoho bill back to the Drive file
      });
  });

  document.getElementById('createVendorBtn').addEventListener('click', function () {
    if (!parsed) return;
    window.go('party', { name: parsed.supplier || '', gstin: parsed.gstin || '' });
  });

  // expose for tests to drive the flow without a real file picker
  window.__scanOnFile = onFile;
})();
</script>
</body></html>
