<style>
  body { font-family:'Hanken Grotesk',sans-serif; background:#fafaf9; color:#18181b; }
  .mono { font-family:'JetBrains Mono',monospace; }
  .hairline-b { border-bottom:1px solid #e7e5e4; }

  .btn-ghost { color:#71717a; border:1px solid #e7e5e4; border-radius:4px; }
  .tag { color:#047857; background:rgba(4,120,87,0.1); border-radius:4px; }

  .tile { border-radius:4px; padding:8px 12px; font-size:11px; letter-spacing:.05em;
          text-transform:uppercase; cursor:pointer; font-family:'JetBrains Mono',monospace; }

  .tile-skip:hover { background:#f5f5f4; }
  .tile-accept { color:#fff; background:#047857; border:1px solid #047857; }
  .tile-accept:disabled { background:#a7d7c5; border-color:#a7d7c5; cursor:not-allowed; }
  .amt-credit { color:#047857; } .amt-debit { color:#18181b; }
</style>
</head>

    <button id="prevBtn" class="btn-ghost px-4 py-2 mono text-xs uppercase">Prev 200</button>
    <span id="pagerLabel" class="mono text-xs text-[#71717a]"></span>

  </div>

<script>
(function () {
  // Accept is feature-flagged OFF until the acceptMatch POST body is resolved
  // (gated spike). Accept tiles render disabled; Skip marks a row reviewed.
  var ACCEPT_ENABLED = false;
  var AXIS = '1161923000000540009';
  var PAGE_SIZE = 200;
  var all = [];      // every uncategorized txn
  var reviewed = {}; // transactionId -> true once skipped/accepted
  var page = 0;      // 0-based page of 200

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}

  function renderProgress() {
    var total = all.length;
    var done = Object.keys(reviewed).length;
    document.getElementById('progressLabel').textContent =
      total ? (done + ' of ' + total + ' reviewed') : 'Nothing to reconcile';
    document.getElementById('progressBar').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
  }

  function pageSlice() {
    var start = page * PAGE_SIZE;
    return all.slice(start, start + PAGE_SIZE);
  }

  function renderRows() {
    var host = document.getElementById('rowHost');
    if (!all.length) {
      document.getElementById('pager').classList.add('hidden');
      AppStates.empty('#rowHost', 'Nothing to reconcile', 'No uncategorized transactions.');
      renderProgress();
      return;
    }
    var rows = pageSlice();
    host.innerHTML = rows.map(function (t) {
      var isDone = !!reviewed[t.transactionId];
      var amtCls = t.type === 'credit' ? 'amt-credit' : 'amt-debit';
      var acceptDis = ACCEPT_ENABLED ? '' : 'disabled title="Accept is disabled until the categorize spike is resolved"';
      return '<div class="rc-row' + (isDone ? ' done' : '') + '" data-id="' + esc(t.transactionId) + '">' +
        '<div class="rc-main">' +
          '<div class="flex items-baseline gap-2">' +
            '<span class="mono text-sm ' + amtCls + '">' + inr(t.amount) + '</span>' +
            '<span class="mono text-xs text-[#71717a] uppercase">' + esc(t.type) + '</span>' +
            '<span class="mono text-xs text-[#71717a]">' + esc(t.date) + '</span>' +
          '</div>' +
          '<div class="rc-narr text-xs text-[#71717a] mt-0.5">' + esc(t.narration) + '</div>' +
        '</div>' +
        '<button class="tile tile-skip" data-act="skip">Skip</button>' +
        '<button class="tile tile-accept" data-act="accept" ' + acceptDis + '>Accept</button>' +
      '</div>';
    }).join('');

    // per-row tile handlers
    Array.prototype.forEach.call(host.querySelectorAll('.rc-row'), function (rowEl) {
      var id = rowEl.getAttribute('data-id');
      rowEl.querySelector('[data-act="skip"]').addEventListener('click', function () {
        reviewed[id] = true; rowEl.classList.add('done'); renderProgress();
      });
      var acc = rowEl.querySelector('[data-act="accept"]');
      acc.addEventListener('click', function () {
        if (!ACCEPT_ENABLED) return; // hard guard
        reviewed[id] = true; rowEl.classList.add('done'); renderProgress();
        // acceptMatch(id, ...) wired here once the spike resolves
      });
    });

    renderPager();
    renderProgress();
  }

  function renderPager() {
    var total = all.length, pages = Math.ceil(total / PAGE_SIZE);
    var pager = document.getElementById('pager');
    if (pages <= 1) { pager.classList.add('hidden'); document.getElementById('pageLabel').textContent = total + ' rows'; return; }
    pager.classList.remove('hidden');
    var start = page * PAGE_SIZE + 1, end = Math.min((page + 1) * PAGE_SIZE, total);
    document.getElementById('pageLabel').textContent = start + '–' + end + ' of ' + total;
    document.getElementById('pagerLabel').textContent = 'Page ' + (page + 1) + ' / ' + pages;
    document.getElementById('prevBtn').disabled = page === 0;
    document.getElementById('nextBtn').disabled = page >= pages - 1;
  }

  document.getElementById('prevBtn').addEventListener('click', function () { if (page > 0) { page--; renderRows(); window.scrollTo(0,0); } });
  document.getElementById('nextBtn').addEventListener('click', function () {
    if (page < Math.ceil(all.length / PAGE_SIZE) - 1) { page++; renderRows(); window.scrollTo(0,0); }
  });

  function load() {
    AppStates.loading('#rowHost', 'Loading transactions…');
    google.script.run
      .withSuccessHandler(function (list) { all = list || []; page = 0; reviewed = {}; renderRows(); })
      .withFailureHandler(function () { AppStates.error('#rowHost', 'Could not load transactions', load); })
      .uncategorized(AXIS);
  }

  document.addEventListener('DOMContentLoaded', load);
  if (document.readyState !== 'loading') load();
  window.__reconAcceptEnabled = ACCEPT_ENABLED;
})();
</script>
</body></html>
