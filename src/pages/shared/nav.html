<!-- Shared navigation + bottom nav bar. In GAS the app runs in a sandboxed iframe,
     so page changes must use top.location with the real web-app URL
     (window.__appUrl, set from <?= appUrl ?>). Include via
     <?!= include('pages/shared/nav') ?> and set window.__appUrl BEFORE this runs.
     Exposes window.go(page, params) and injects a consistent bottom nav on every
     page that includes it — so navigation is present on ALL pages, present and
     future, with zero per-page markup. -->
<style>
  #pm-nav { position:fixed; bottom:0; left:0; width:100%; z-index:60;
            display:flex; justify-content:space-around; align-items:center;
            height:64px; background:#fafaf9; border-top:1px solid #e7e5e4;
            font-family:'JetBrains Mono',monospace; padding-bottom:env(safe-area-inset-bottom,0); }
  #pm-nav a { display:flex; flex-direction:column; align-items:center; gap:2px;
              color:#71717a; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
              cursor:pointer; padding:6px 10px; border-radius:6px; text-decoration:none; }
  #pm-nav a .material-symbols-outlined { font-size:22px; }
  #pm-nav a.active { color:#047857; background:rgba(4,120,87,0.08); }
  /* keep page content clear of the fixed bar */
  body { padding-bottom:76px; }
  /* A page's own fixed bottom bar (Save / action bar) would otherwise sit UNDER
     the nav, which then swallows its clicks. Lift such bars above the nav.
     body padding only clears scrolling content — fixed elements ignore it. */
  body > .fixed.bottom-0, body > div.fixed.bottom-0 { bottom:64px; z-index:55; }
</style>
<script>
(function () {
  window.go = function (page, params) {
    var qs = 'p=' + encodeURIComponent(page);
    if (params) for (var k in params) qs += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);

    // Are we inside the GitHub Pages wrapper (a cross-origin top frame that hides
    // the raw GAS URL)? If so, change the WRAPPER's query string — it keeps its
    // clean github.io URL and re-points its iframe. If we're the top frame
    // ourselves (opened raw), just navigate our own query string.
    var framedByWrapper = false;
    try { framedByWrapper = (window.top !== window.self) && (window.top.location.origin !== window.location.origin); }
    catch (e) { framedByWrapper = true; } // cross-origin access throws → we ARE framed by another origin

    if (framedByWrapper) {
      // Ask the wrapper to re-point its iframe. Assigning top.location.search
      // directly does NOT work here: GAS serves this page inside its own
      // sandbox frame, so the wrapper is cross-origin and the browser blocks
      // the write — which used to fall through and navigate to the raw GAS URL,
      // exposing script.google.com in the address bar.
      try { window.top.postMessage({ type: 'pm-nav', qs: qs }, '*'); return; }
      catch (e) { /* fall through to a direct navigation */ }
    }
    // standalone: navigate the app directly (break out of GAS's own sandbox iframe)
    var base = window.__appUrl || '';
    var url = base ? (base + '?' + qs) : ('?' + qs);
    try { window.top.location.href = url; } catch (e) { window.location.href = url; }
  };
  // Which page are we on? (from ?p= on either the wrapper or the app frame)
  function currentPage() {
    // The server knows which page it rendered. Prefer that: inside the wrapper
    // this frame is cross-origin to the top window, so top.location.search
    // throws and the nav could never highlight the active tab.
    if (window.__page) return window.__page;
    var s = '';
    try { s = window.top.location.search || ''; } catch (e) {}
    if (!s) s = window.__search || window.location.search || '';
    var m = /[?&]p=([^&]*)/.exec(s);
    return m ? decodeURIComponent(m[1]) : 'home';
  }

  // The nav items. Add a new screen here once and every page shows it.
  var NAV = [
    { page: 'home',      label: 'Home',      icon: 'home' },
    { page: 'scan',      label: 'Scan',      icon: 'qr_code_scanner' },
    { page: 'reconcile', label: 'Reconcile', icon: 'account_balance' },
    { page: 'ledger',    label: 'Ledger',    icon: 'receipt_long' }
  ];

  function injectNav() {
    if (document.getElementById('pm-nav')) return; // already present
    var cur = currentPage();
    var nav = document.createElement('nav');
    nav.id = 'pm-nav';
    nav.innerHTML = NAV.map(function (it) {
      var active = (it.page === cur) ? ' active' : '';
      return '<a class="' + active.trim() + '" data-go="' + it.page + '">' +
        '<span class="material-symbols-outlined">' + it.icon + '</span>' + it.label + '</a>';
    }).join('');
    document.body.appendChild(nav);
  }

  function wireGo(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('[data-go]'), function (el) {
      if (el.__goWired) return; el.__goWired = true;
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        var p = null;
        try { p = el.getAttribute('data-go-params') ? JSON.parse(el.getAttribute('data-go-params')) : null; } catch (e) {}
        window.go(el.getAttribute('data-go'), p);
      });
    });
  }

  // Pages that render rows after load (home attention, reconcile, ledger) must
  // re-wire the new [data-go] nodes. Idempotent — already-wired nodes are skipped.
  window.wireGo = wireGo;

  document.addEventListener('DOMContentLoaded', function () {
    injectNav();     // consistent bottom nav on every page
    wireGo();        // wire all [data-go] (page's own + the injected nav)
  });
  if (document.readyState !== 'loading') { injectNav(); wireGo(); }
})();
</script>
