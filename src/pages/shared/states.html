<!-- Shared loading / empty / error state blocks (Industrial Ledger styling).
     Include via: <?!= include('pages/shared/states') ?>
     Then in a page:
        <div id="stateHost"></div>
        AppStates.loading('#stateHost', 'Reading bill…')
        AppStates.empty('#stateHost', 'No open bills', 'Everything is settled.')
        AppStates.error('#stateHost', 'Could not reach Zoho', retryFn)
        AppStates.clear('#stateHost')
     Colors: emerald #047857, stone #fafaf9, hairline #e7e5e4, zinc #18181b/#71717a. -->
<style>
  .st-wrap { font-family:'Hanken Grotesk',sans-serif; padding:32px 20px; text-align:center; color:#18181b; }
  .st-wrap .st-sub { color:#71717a; font-size:14px; margin-top:4px; }
  .st-wrap .st-title { font-size:16px; font-weight:600; }
  .st-spinner { width:28px; height:28px; margin:0 auto 12px; border:3px solid #e7e5e4;
                border-top-color:#047857; border-radius:9999px; animation:st-spin .8s linear infinite; }
  @keyframes st-spin { to { transform:rotate(360deg); } }
  .st-icon { font-size:28px; margin-bottom:8px; line-height:1; }
  .st-retry { margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:12px;
              letter-spacing:.05em; text-transform:uppercase; background:#047857; color:#fff;
              border:none; border-radius:4px; padding:10px 18px; cursor:pointer; }
  .st-err .st-icon { color:#ba1a1a; }
</style>
<script>
(function () {
  function host(sel) { return typeof sel === 'string' ? document.querySelector(sel) : sel; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  window.AppStates = {
    loading: function (sel, msg) {
      var h = host(sel); if (!h) return;
      h.innerHTML = '<div class="st-wrap"><div class="st-spinner"></div>' +
        '<div class="st-title">' + esc(msg || 'Loading…') + '</div></div>';
    },
    empty: function (sel, title, sub) {
      var h = host(sel); if (!h) return;
      h.innerHTML = '<div class="st-wrap"><div class="st-icon">—</div>' +
        '<div class="st-title">' + esc(title || 'Nothing here') + '</div>' +
        (sub ? '<div class="st-sub">' + esc(sub) + '</div>' : '') + '</div>';
    },
    error: function (sel, msg, retryFn) {
      var h = host(sel); if (!h) return;
      h.innerHTML = '<div class="st-wrap st-err"><div class="st-icon">!</div>' +
        '<div class="st-title">' + esc(msg || 'Something went wrong') + '</div>' +
        (retryFn ? '<button class="st-retry" type="button">Retry</button>' : '') + '</div>';
      if (retryFn) { var b = h.querySelector('.st-retry'); if (b) b.addEventListener('click', retryFn); }
    },
    clear: function (sel) { var h = host(sel); if (h) h.innerHTML = ''; }
  };
})();
</script>
